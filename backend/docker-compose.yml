# LingoGo backend. Letaknya bersaudara dengan database/ di repo yang sama:
#   lingogo/
#     database/  <- CSV: provinsi, kota, bahasa daerah, frasa, pelafalan, nomor darurat
#     backend/   <- file ini
#
#   docker compose up -d --build                    # lokal (tanpa tunnel)
#   docker compose --profile tunnel up -d --build   # di STB (dengan Cloudflare Tunnel)
name: lingogo

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:
  phrase-service:
    <<: *common
    build: ./phrase-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      API_KEYS: ${API_KEYS:-}
      DB_PATH: /data/phrases.db
      DATABASE_DIR: /database
    volumes:
      - phrase_data:/data
      - ../database:/database:ro                    # sumber data CSV (read-only)
    mem_limit: 160m
    cpus: 0.5          # aturan STB: batasi memori & CPU

  user-service:
    <<: *common
    build: ./user-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lingogo.stei.site}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@lingogo.stei.site}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo123}
      DB_PATH: /data/users.db
    volumes:
      - user_data:/data
    mem_limit: 128m
    cpus: 0.5

  gateway:
    <<: *common
    image: nginx:1.28-alpine
    depends_on: [phrase-service, user-service]
    ports:
      - "${GATEWAY_PORT:-8080}:80"   # uji di jaringan lokal; akses publik lewat tunnel
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./gateway/docs:/usr/share/nginx/docs:ro
    mem_limit: 64m
    cpus: 0.25

  tunnel:
    <<: *common
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on: [gateway]
    profiles: ["tunnel"]
    mem_limit: 96m
    cpus: 0.25

volumes:
  phrase_data:
  user_data:
