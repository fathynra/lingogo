# Gateway LingoGo: satu pintu masuk (port 80 di dalam Docker).
# Cloudflare Tunnel meneruskan https://lingogo.stei.site -> gateway:80

# Alamat asli klien dari Cloudflare (supaya rate limit per pengguna, bukan per tunnel)
real_ip_header CF-Connecting-IP;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=audio:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m  rate=1r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# DNS internal Docker: service yang mati/restart tidak membuat gateway gagal start (-> 502, bukan crash)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;
    limit_conn perip 20;

    default_type application/json;
    error_page 429 = @too_many;
    error_page 502 503 504 = @upstream_down;
    location @too_many      { return 429 '{"detail":"Terlalu banyak permintaan, coba lagi sebentar"}'; }
    location @upstream_down { return 502 '{"detail":"Service sedang tidak tersedia"}'; }

    set $phrase_up http://phrase-service:8000;
    set $user_up   http://user-service:8000;

    # --- health & dokumentasi (tanpa auth) ---
    location = /api/health {
        return 200 '{"gateway":"ok"}';
    }
    location = /api/health/phrase-service {
        rewrite ^ /health break;
        proxy_pass $phrase_up;
    }
    location = /api/health/user-service {
        rewrite ^ /health break;
        proxy_pass $user_up;
    }
    location = /api/docs {
        default_type text/html;
        alias /usr/share/nginx/docs/index.html;
    }
    location = /api/openapi.yaml {
        default_type application/yaml;
        alias /usr/share/nginx/docs/openapi.yaml;
        add_header Access-Control-Allow-Origin *;
    }

    # --- audio statis (Pronunciation Context) ---
    location /api/audio/ {
        limit_req zone=audio burst=60 nodelay;
        alias /usr/share/audio/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        types { audio/mpeg mp3; audio/ogg opus ogg; audio/wav wav; }
        autoindex off;
    }

    # --- User Context (auth lebih ketat: anti brute force) ---
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $user_up;
        include /etc/nginx/proxy_params.conf;
    }
    location /api/users/ {
        limit_req zone=api burst=40 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $user_up;
        include /etc/nginx/proxy_params.conf;
    }

    # --- Destination & Language + Phrasebook Context ---
    location ~ ^/api/(languages|destinations|categories|phrases|emergency-numbers)(/|$) {
        limit_req zone=api burst=40 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $phrase_up;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        return 404 '{"detail":"Not found. Lihat /api/docs"}';
    }
}
