openapi: 3.1.0
info:
  title: LingoGo API
  version: 1.0.0
  description: 'API LingoGo (Tourism Language Assistance) — cari kota di Indonesia, bahasa daerahnya,
    frasa, pelafalan & arti.


    **Autentikasi**

    - Pengguna aplikasi: `Authorization: Bearer <JWT>` dari `POST /auth/login`.

    - Kelompok lain (server ke server): header `X-API-Key` (minta ke kelompok lingogo).

    - Dibatasi rate limit per IP (HTTP 429 jika berlebihan).'
servers:
- url: https://lingogo.stei.site/api
tags:
- name: system
- name: auth
- name: users
- name: region
- name: language
- name: phrasebook
- name: admin
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Masuk, dapat JWT
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Keluar (token dicabut)
      operationId: logout_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /auth/me:
    get:
      tags:
      - auth
      summary: Data akun + preferensi
      operationId: me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - HTTPBearer: []
  /auth/register:
    post:
      tags:
      - auth
      summary: Daftar akun baru
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /categories:
    get:
      tags:
      - phrasebook
      summary: Daftar kategori frasa
      operationId: list_categories_categories_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
                title: Response List Categories Categories Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cities:
    get:
      tags:
      - region
      summary: Cari kota/kabupaten (q) atau daftar semua
      description: 'Dengan `q`: cocok jika nama mengandung teks (tidak peka huruf besar/aksen; awalan
        ''Kota''/''Kab.'' boleh dipakai). Jika tidak ada yang cocok -> **404** dengan pesan ''Maaf, kota
        yang Anda cari tidak ada di database.'' (sesuai `ui`). Tanpa `q` = daftar berhalaman.'
      operationId: search_cities_cities_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 60
          - type: 'null'
          description: Teks pencarian, mis. 'surabaya'
          title: Q
        description: Teks pencarian, mis. 'surabaya'
      - name: province
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter kode provinsi, mis. 35
          title: Province
        description: Filter kode provinsi, mis. 35
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - kota
            - kabupaten
            type: string
          - type: 'null'
          title: Type
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cities/{code}:
    get:
      tags:
      - region
      summary: 'Detail satu kota: provinsi + bahasa daerahnya'
      operationId: get_city_cities__code__get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cities/{code}/phrasebook:
    get:
      tags:
      - phrasebook
      summary: 'Alur utama: kota -> frasa per kategori dalam bahasa daerahnya'
      description: '`lang` opsional; kosong = bahasa utama kota. Untuk kota berbahasa ganda, `available_languages`
        berisi pilihan lainnya.'
      operationId: city_phrasebook_cities__code__phrasebook_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: lang
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Salah satu bahasa kota ini
          title: Lang
        description: Salah satu bahasa kota ini
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      - name: pron
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - en
            - id
            type: string
          - type: 'null'
          description: Default = ui
          title: Pron
        description: Default = ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityPhrasebook'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /emergency-numbers:
    get:
      tags:
      - region
      summary: Nomor darurat nasional (polisi, damkar, ambulans, SAR, 112)
      operationId: emergency_numbers_emergency_numbers_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmergencyNumber'
                title: Response Emergency Numbers Emergency Numbers Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - system
      summary: Cek gateway hidup (tanpa auth)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                gateway: ok
  /health/phrase-service:
    get:
      tags:
      - system
      summary: Cek phrase-service (tanpa auth)
      security: []
      responses:
        '200':
          description: OK
        '502':
          description: Service mati
  /health/user-service:
    get:
      tags:
      - system
      summary: Cek user-service (tanpa auth)
      security: []
      responses:
        '200':
          description: OK
        '502':
          description: Service mati
  /languages:
    get:
      tags:
      - language
      summary: Daftar bahasa daerah
      operationId: list_languages_languages_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'
                title: Response List Languages Languages Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /languages/{code}:
    get:
      tags:
      - language
      summary: Detail satu bahasa
      operationId: get_language_languages__code__get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Language'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /languages/{code}/phrasebook:
    get:
      tags:
      - phrasebook
      summary: Seluruh frasa satu bahasa, dikelompokkan per kategori
      operationId: language_phrasebook_languages__code__phrasebook_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      - name: pron
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - en
            - id
            type: string
          - type: 'null'
          description: Default = ui
          title: Pron
        description: Default = ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phrasebook'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /phrases:
    get:
      tags:
      - phrasebook
      summary: Daftar frasa (datar, berhalaman) dalam satu bahasa daerah
      operationId: list_phrases_phrases_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: lang
        in: query
        required: true
        schema:
          type: string
          description: Kode bahasa daerah, mis. jv_ID
          title: Lang
        description: Kode bahasa daerah, mis. jv_ID
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      - name: pron
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - en
            - id
            type: string
          - type: 'null'
          description: Gaya pelafalan, default = ui
          title: Pron
        description: Gaya pelafalan, default = ui
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter kode kategori, mis. greeting
          title: Category
        description: Filter kode kategori, mis. greeting
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 50
          - type: 'null'
          description: Cari di istilah daerah / arti
          title: Q
        description: Cari di istilah daerah / arti
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /phrases/{key}:
    get:
      tags:
      - phrasebook
      summary: Satu frasa
      operationId: get_phrase_phrases__key__get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: lang
        in: query
        required: true
        schema:
          type: string
          description: Kode bahasa daerah
          title: Lang
        description: Kode bahasa daerah
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      - name: pron
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - en
            - id
            type: string
          - type: 'null'
          description: Default = ui
          title: Pron
        description: Default = ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /phrases/{key}/translations/{lang}:
    put:
      tags:
      - admin
      summary: '[Admin] Ubah teks / pelafalan sebuah terjemahan'
      operationId: update_translation_phrases__key__translations__lang__put
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: lang
        in: path
        required: true
        schema:
          type: string
          title: Lang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /provinces:
    get:
      tags:
      - region
      summary: Daftar provinsi + bahasa daerahnya
      operationId: list_provinces_provinces_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Province'
                title: Response List Provinces Provinces Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /provinces/{code}:
    get:
      tags:
      - region
      summary: Detail satu provinsi
      operationId: get_province_provinces__code__get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Province'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /provinces/{code}/cities:
    get:
      tags:
      - region
      summary: Kota/kabupaten di satu provinsi
      operationId: province_cities_provinces__code__cities_get
      security:
      - APIKeyHeader: []
      - HTTPBearer: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: ui
        in: query
        required: false
        schema:
          enum:
          - en
          - id
          type: string
          default: en
          title: Ui
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/me/preferences:
    get:
      tags:
      - users
      summary: Lihat preferensi
      operationId: get_prefs_users_me_preferences_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - users
      summary: Ubah preferensi (bahasa UI, gaya pelafalan, bahasa daerah, kota)
      operationId: update_prefs_users_me_preferences_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    Category:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        phrase_count:
          type: integer
          title: Phrase Count
      type: object
      required:
      - code
      - name
      - phrase_count
      title: Category
    CategoryRef:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - code
      - name
      title: CategoryRef
    City:
      properties:
        code:
          type: string
          title: Code
          examples:
          - '3578'
        name:
          type: string
          title: Name
          examples:
          - Surabaya
        type:
          type: string
          title: Type
          description: kota | kabupaten
        province:
          $ref: '#/components/schemas/ProvinceRef'
        languages:
          items:
            $ref: '#/components/schemas/Language'
          type: array
          title: Languages
          description: Bahasa daerah kota; yang pertama = utama
      type: object
      required:
      - code
      - name
      - type
      - province
      - languages
      title: City
    CityList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/City'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: CityList
    CityPhrasebook:
      properties:
        language:
          $ref: '#/components/schemas/Language'
        categories:
          items:
            $ref: '#/components/schemas/PhrasebookCategory'
          type: array
          title: Categories
        city:
          $ref: '#/components/schemas/City'
        available_languages:
          items:
            $ref: '#/components/schemas/Language'
          type: array
          title: Available Languages
          description: Semua bahasa kota ini (untuk pilihan ganti bahasa)
      type: object
      required:
      - language
      - categories
      - city
      - available_languages
      title: CityPhrasebook
    EmergencyNumber:
      properties:
        service:
          type: string
          title: Service
          examples:
          - police
        name:
          type: string
          title: Name
        number:
          type: string
          title: Number
      type: object
      required:
      - service
      - name
      - number
      title: EmergencyNumber
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Language:
      properties:
        code:
          type: string
          title: Code
          examples:
          - jv_ID
        name:
          type: string
          title: Name
          description: Nama bahasa dalam bahasa antarmuka (ui)
        native_name:
          type: string
          title: Native Name
        is_approximate:
          type: boolean
          title: Is Approximate
          description: True = belum ada data asli, isinya memakai bahasa terdekat
        closest_code:
          type: string
          title: Closest Code
          description: Kode bahasa terdekat; sama dengan code jika data asli
        phrase_count:
          type: integer
          title: Phrase Count
      type: object
      required:
      - code
      - name
      - native_name
      - is_approximate
      - closest_code
      - phrase_count
      title: Language
    Meaning:
      properties:
        lang:
          type: string
          title: Lang
          description: '''id'' atau ''en'''
        text:
          type: string
          title: Text
      type: object
      required:
      - lang
      - text
      title: Meaning
    PhraseCard:
      properties:
        key:
          type: string
          title: Key
        text:
          type: string
          title: Text
          description: Istilah dalam bahasa daerah
        pronunciation:
          $ref: '#/components/schemas/Pronunciation'
        meaning:
          $ref: '#/components/schemas/Meaning'
      type: object
      required:
      - key
      - text
      - pronunciation
      - meaning
      title: PhraseCard
      description: 'Satu kartu: istilah daerah (tebal, besar), pelafalan (kecil), arti (sedang).'
    PhraseList:
